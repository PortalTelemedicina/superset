slice_name: Tendência da demanda programada — unidades do município
description: Mostra as 5 vacinas de maior volume previsto. Use o filtro Vacina para
  comparar a projeção de uma ou duas vacinas específicas; os volumes exatos estão
  na matriz abaixo.
certified_by: null
certification_details: null
viz_type: ptm_echarts_timeseries
params:
  x_axis: forecast_month
  time_grain_sqla: P1M
  metrics:
  - label: Doses previstas
    expressionType: SIMPLE
    aggregate: SUM
    column:
      column_name: expected_doses
  groupby:
  - vaccine_name
  adhoc_filters:
  - clause: WHERE
    subject: forecast_month
    operator: TEMPORAL_RANGE
    comparator: 'DATEADD(DATETIME(''now''), -1, month) : DATEADD(DATETIME(''now''),
      12, month)'
    expressionType: SIMPLE
  - expressionType: SIMPLE
    subject: status_bucket
    operator: NOT IN
    comparator:
    - overdue
    clause: WHERE
    filterOptionName: filter_programmed_only
  limit: 5
  row_limit: 10000
  show_legend: true
  y_axis_format: ',d'
  ptm_series_type: line
  x_axis_time_format: smart_date
  ptm_zoom_enabled: true
  ptm_zoom_axis: x
  ptm_zoom_size: xs
  ptm_zoom_inset: '24'
  viz_type: ptm_echarts_timeseries
  datasource: '{dataset_id}__table'
cache_timeout: null
uuid: bcc87211-8963-524f-9c25-7bd0e94ad5c6
