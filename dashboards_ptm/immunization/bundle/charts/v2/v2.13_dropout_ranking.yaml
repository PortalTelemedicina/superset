slice_name: Ranking de abandono por série vacinal
description: null
certified_by: null
certification_details: null
viz_type: ptm_table
params:
  metrics:
  - label: Abandono efetivo
    expressionType: SIMPLE
    aggregate: AVG
    column:
      column_name: effective_dropout_rate
  - label: Dose inicial (N)
    expressionType: SIMPLE
    aggregate: SUM
    column:
      column_name: applied_from_count
  - label: Dose seguinte (N)
    expressionType: SIMPLE
    aggregate: SUM
    column:
      column_name: applied_to_count
  - label: Ranking
    expressionType: SIMPLE
    aggregate: MIN
    column:
      column_name: priority_rank
  groupby:
  - vaccine_name
  - dose_from_label
  - dose_to_label
  - cohort_birth_year
  adhoc_filters: []
  row_limit: 100
  page_length: 20
  include_search: true
  show_cell_bars: true
  viz_type: ptm_table
  datasource: '{dataset_id}__table'
cache_timeout: null
