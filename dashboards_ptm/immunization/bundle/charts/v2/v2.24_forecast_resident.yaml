slice_name: Volumes da demanda programada — população residente
description: null
certified_by: null
certification_details: null
viz_type: ptm_pivot_table
params:
  groupbyRows:
  - vaccine_name
  groupbyColumns:
  - forecast_month
  metrics:
  - label: Doses previstas
    expressionType: SIMPLE
    aggregate: SUM
    column:
      column_name: expected_doses
  metricsLayout: COLUMNS
  adhoc_filters:
  - clause: WHERE
    subject: forecast_month
    operator: TEMPORAL_RANGE
    comparator: 'DATEADD(DATETIME(''now''), -1, month) : DATEADD(DATETIME(''now''),
      12, month)'
    expressionType: SIMPLE
  - expressionType: SIMPLE
    subject: status_bucket
    operator: NOT IN
    comparator:
    - overdue
    clause: WHERE
    filterOptionName: filter_programmed_only
  row_limit: 10000
  valueFormat: ','
  rowOrder: value_z_to_a
  colOrder: key_a_to_z
  aggregateFunction: Sum
  conditional_formatting:
  - operator: '>'
    targetValue: 0
    colorScheme: '#1565c0'
    column: SUM(expected_doses)
  viz_type: ptm_pivot_table
  datasource: '{dataset_id}__table'
cache_timeout: null
